templates:
  # A template that intentionally violates the response schema.
  # Useful for testing how your client handles malformed responses.
  # Must live here (not in .auto.yml) so regeneration does not erase it.
  invalid_success_shape:
    args:
      status_code: 201
    interaction:
      method: POST
      path: /orders
      response:
        status: "{status_code}"
        body:
          bad_field: should_fail
