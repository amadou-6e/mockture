openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/{order_id}:
    get:
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
components:
  schemas:
    CreateOrderRequest:
      type: object
      properties:
        item_id:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 100
      required:
        - item_id
        - quantity
    OrderResponse:
      type: object
      properties:
        order_id:
          type: string
        status:
          type: string
      required:
        - order_id
        - status
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
