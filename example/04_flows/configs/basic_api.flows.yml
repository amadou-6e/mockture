flows:
  # Sequence: POST to create, then GET to verify status.
  create_and_fetch:
    - template: create_order_success
      args:
        order_id: ord-flow-001
        status: queued
    - template: get_order
      args:
        order_id: ord-flow-001
        status: queued

  # Single template shorthand.
  conflict_only: create_order_conflict

  # Multiple invocations of the same template — list value.
  batch_create:
    - template: create_order_success
      args:
        order_id: ord-batch-001
        status: created
    - template: create_order_success
      args:
        order_id: ord-batch-002
        status: created

  # Scenario dict — keys are template names, values are args.
  happy_path_scenario:
    create_order_success:
      order_id: ord-happy-001
      status: created
    get_order:
      order_id: ord-happy-001
      status: created
