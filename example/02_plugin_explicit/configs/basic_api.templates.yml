templates:
  create_order_success:
    args:
      status_code: 201
      order_id: ord-default
      status: created
    interaction:
      method: POST
      path: /orders
      response:
        status: "{status_code}"
        body:
          order_id: "{order_id}"
          status: "{status}"

  create_order_conflict:
    args:
      status_code: 409
      message: Item is unavailable
    interaction:
      method: POST
      path: /orders
      response:
        status: "{status_code}"
        body:
          message: "{message}"

  get_order:
    args:
      order_id:             # required — caller must supply
      status_code: 200
      status: created
    interaction:
      method: GET
      path: /orders/{order_id}
      response:
        status: "{status_code}"
        body:
          order_id: "{order_id}"
          status: "{status}"

  get_order_not_found:
    args:
      order_id:             # required
      status_code: 404
      message: Order not found
    interaction:
      method: GET
      path: /orders/{order_id}
      response:
        status: "{status_code}"
        body:
          message: "{message}"
